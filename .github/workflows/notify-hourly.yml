name: Hourly notifications
# Calls Marvberry every hour: sends morning notes and the one-day unread emails.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Run the hourly check
        run: |
          curl -fsS -H "Authorization: Bearer ${{ secrets.NOTIFY_CRON_SECRET }}" https://www.marvberry.com/api/cron/notify
